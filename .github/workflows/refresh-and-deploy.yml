# The robot. Twice a day (and whenever something is pushed) it:
#   0. runs the security gate: checks what's about to go live (spec 008)
#   1. runs every test (stops here if anything fails)
#   2. downloads + validates the CISA KEV catalog
#   3. commits the data, but only if it changed
#   4. builds the feeds from the data (spec 005; never committed)
#   5. publishes the site/ folder to GitHub Pages
#   6. tells Slack what's new since the last alert (spec 005; only if the secret is set)
#
# You can also run it by hand: Actions tab -> "Refresh data & deploy" -> "Run workflow".
# Tick "Send a test message to Slack" there to check the Slack setup, or
# "Accept rule change" to approve data that only passes loosened gatekeeper rules,
# or "Approve publisher commits" to let through publisher commits the gate stopped.

name: Refresh data & deploy

on:
  schedule:
    - cron: "17 6,18 * * *"   # 06:17 and 18:17 UTC daily (odd minute = less queueing)
  workflow_dispatch:           # the manual "Run workflow" button (spec FR-10)
    inputs:
      test_alert:
        description: "Send a test message to Slack (checks the alert setup)"
        type: boolean
        default: false
      accept_rule_change:
        description: "Accept rule change: publish data that only passes loosened gatekeeper rules (spec 008)"
        type: boolean
        default: false
      approve_publisher_commits:
        description: "Approve publisher commits: let through publisher commits the gate stopped, after you've checked or reverted them (spec 008)"
        type: boolean
        default: false
  push:
    branches: [main]           # redeploy when the site code changes

# Start with zero permissions; each job below asks for only what it needs (NFR-3).
permissions: {}

# Never let two runs deploy at the same time. A run that's queued waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Test, fetch and commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # allowed to push the data commit
      pages: read       # allowed to look up the site's address (for full links in the feeds)
    outputs:
      data_sha: ${{ steps.published.outputs.sha }}     # the commit whose data is being published
      base_url: ${{ steps.pages.outputs.base_url }}    # e.g. https://zelin.se
      gate_report: ${{ steps.gate.outputs.gate_report }}   # what the security gate found (spec 008)
    steps:
      # Actions are pinned to an exact commit (the long hash) so nobody can swap
      # the code behind a version tag. Dependabot updates these hashes weekly.
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps the push credential in .git/ for the commit step below.
          # Safe here: only the site/ folder is ever published, never .git/.
          persist-credentials: true
          fetch-depth: 0     # the whole history, so the gate can compare with the last deploy
          fetch-tags: true

      # Spec 008: every push arrives as the same GitHub account, so this gate
      # tells the publishers apart by their commit titles and checks that they
      # only changed their own data, and that loosened rules don't slip through.
      # It runs first, so a stopped deploy always has a report for Slack.
      - name: Security gate
        id: gate
        env:
          ACCEPT: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_rule_change }}
          APPROVE: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_publisher_commits }}
        run: |
          flags=()
          [ "$ACCEPT" = "true" ] && flags+=(--accept-rule-change)
          [ "$APPROVE" = "true" ] && flags+=(--approve-publisher-commits)
          python3 scripts/deploy_gate.py "${flags[@]}"

      - name: Run tests
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py" -v
          python3 scripts/add_sitrep.py --check   # every published Sitrep issue must still be valid
          python3 scripts/add_breachwire.py --check   # every Breach Wire issue must still be valid
          node --test tests/stats.test.mjs tests/site.test.mjs tests/sitrep.test.mjs tests/breachwire.test.mjs tests/stack.test.mjs tests/presets.test.mjs tests/stack-store.test.mjs tests/opml.test.mjs tests/ui.test.mjs tests/contrast.test.mjs tests/theme.test.mjs tests/today.test.mjs tests/breach-stats.test.mjs
          env LC_ALL=sv_SE.UTF-8 LANG=sv_SE.UTF-8 node --test tests/ui.test.mjs   # dates stay English in a Swedish setting

      - name: Fetch and validate the KEV catalog
        run: python3 scripts/fetch_kev.py

      - name: Commit the data if it changed
        run: |
          git add site/data/kev.json site/data/meta.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged. Nothing to commit."
            exit 0
          fi
          version=$(python3 -c "import json; print(json.load(open('site/data/meta.json'))['catalogVersion'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: KEV catalog ${version}"
          git pull --rebase --quiet origin main   # in case someone pushed meanwhile
          git push origin HEAD:main

      - name: Remember which commit is being published
        id: published
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Asks GitHub for the site's current address. It follows the custom domain,
      # and switches to https by itself once "Enforce HTTPS" is on.
      - name: Look up the site's address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the feeds
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}   # passed as data, never pasted into the script
        run: python3 scripts/build_feeds.py --base-url "$BASE_URL"

      # Spec 009: the Today page reads a small slice of the catalog (last 400 days,
      # six fields) instead of the full 1.4 MB file. Derived, never committed.
      - name: Build the Today page's catalog slice
        run: python3 scripts/build_recent.py

      # Spec 010: monthly Breach Wire numbers for the Trends section. Built from
      # the checked issues; holds numbers, sector names and group names only.
      - name: Build the Breach Wire statistics
        run: python3 scripts/build_breach_stats.py

      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # Needed for site/.well-known/security.txt (spec 008). The site test
          # checks that .well-known is the only hidden folder in site/.
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # allowed to publish the site
      id-token: write   # proves to GitHub Pages that this deploy came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Slack alerts (spec 005). Runs only after a successful deploy, so every link works.
  # The "alerts-sent" git tag marks the last commit whose data was alerted; what's
  # new = the data now compared with the data at that tag.
  alert:
    name: Slack alerts
    needs: [refresh, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # only to move the alerts-sent tag
    steps:
      - name: Check out the published commit, with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.data_sha }}
          fetch-depth: 0         # the whole history, so the old data can be read back
          fetch-tags: true
          persist-credentials: true   # to push the tag; only site/ is ever published

      # Spec 008: the deploy succeeded, so this commit is now "the last deployed one"
      # the security gate compares the next run with. First thing in this job, so
      # a Slack hiccup below can't stop it.
      - name: Mark this commit as deployed
        env:
          DATA_SHA: ${{ needs.refresh.outputs.data_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f deployed "$DATA_SHA"
          git push -f origin refs/tags/deployed

      - name: Send a test message
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        env:
          # The webhook address is a secret: GitHub hides it in logs, and only these two steps can see it.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_URL: ${{ needs.refresh.outputs.base_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::Slack alerts aren't set up yet: add the SLACK_WEBHOOK_URL repository secret."
            exit 0
          fi
          python3 scripts/notify_slack.py --test-message --site-url "$SITE_URL"

      - name: Alert what's new since the last alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_URL: ${{ needs.refresh.outputs.base_url }}
          DATA_SHA: ${{ needs.refresh.outputs.data_sha }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack alerts aren't set up (no SLACK_WEBHOOK_URL secret). Skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify refs/tags/alerts-sent > /dev/null; then
            echo "First run: recording the starting point. Nothing is sent this time."
            git tag alerts-sent "$DATA_SHA"
            git push origin refs/tags/alerts-sent
            exit 0
          fi
          old="$(mktemp -d)"
          git archive alerts-sent site/data | tar -x -C "$old" --strip-components=2   # the data as it was at the last alert
          python3 scripts/notify_slack.py --old "$old" --new site/data --site-url "$SITE_URL"
          # Only reached if every message went through; otherwise the news is retried next run.
          git tag -f alerts-sent "$DATA_SHA"
          git push -f origin refs/tags/alerts-sent

      - name: Heads-up if code changed (spec 008)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_URL: ${{ needs.refresh.outputs.base_url }}
          GATE_REPORT: ${{ needs.refresh.outputs.gate_report }}   # passed as data, never pasted into the script
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ] || [ -z "$GATE_REPORT" ]; then
            echo "Nothing to send (no Slack secret or no gate report)."
            exit 0
          fi
          python3 scripts/notify_slack.py --gate-report "$GATE_REPORT" --gate-kind heads-up --run-url "$RUN_URL" --site-url "$SITE_URL"

  # Spec 008: the security gate stopped the deploy. The live site is unchanged;
  # this tells Slack why (GitHub also emails the owner that the run failed).
  blocked:
    name: Tell Slack the deploy was stopped
    needs: refresh
    if: failure() && needs.refresh.outputs.gate_report != '' && !fromJSON(needs.refresh.outputs.gate_report).ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post the reason
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GATE_REPORT: ${{ needs.refresh.outputs.gate_report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::Deploy stopped by the security gate; Slack isn't set up, so only GitHub's failure email goes out."
            exit 0
          fi
          python3 scripts/notify_slack.py --gate-report "$GATE_REPORT" --gate-kind blocked --run-url "$RUN_URL" --site-url "https://zelin.se/"
