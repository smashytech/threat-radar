# Runs the test suite on every pull request, including the weekly ones from
# Dependabot. If an update would break something, the PR shows a red X and
# you simply don't merge it.

name: Tests

on:
  pull_request:

permissions:
  contents: read   # read-only: this workflow can't change anything

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: JavaScript tests
        run: node --test tests/stats.test.mjs tests/site.test.mjs
