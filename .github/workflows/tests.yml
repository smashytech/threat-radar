# Runs the test suite on every pull request, including the weekly ones from
# Dependabot. If an update would break something, the PR shows a red X and
# you simply don't merge it.

name: Tests

on:
  pull_request:

permissions:
  contents: read   # read-only: this workflow can't change anything

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check published Sitrep and Breach Wire issues
        run: |
          python3 scripts/add_sitrep.py --check
          python3 scripts/add_breachwire.py --check
      - name: JavaScript tests
        run: node --test tests/stats.test.mjs tests/site.test.mjs tests/sitrep.test.mjs tests/breachwire.test.mjs tests/stack.test.mjs tests/presets.test.mjs tests/stack-store.test.mjs tests/opml.test.mjs tests/ui.test.mjs
      - name: Dates stay English in a Swedish setting
        run: env LC_ALL=sv_SE.UTF-8 LANG=sv_SE.UTF-8 node --test tests/ui.test.mjs
